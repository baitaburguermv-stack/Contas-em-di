<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartões Motorista V2</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#e8e8ea; font-family:"Outfit",system-ui,sans-serif; padding:40px 16px; color:#333; }
  h1 { text-align:center; font-size:20px; font-weight:600; letter-spacing:2px; margin:10px 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,280px)); gap:32px; justify-content:center; margin-bottom:56px; }
  figure { display:flex; flex-direction:column; align-items:center; gap:12px; }
  figcaption { font-size:14px; font-weight:600; color:#444; letter-spacing:1px; }
  .card { position:relative; width:100%; aspect-ratio:54/85.6; border-radius:22px; box-shadow:0 22px 44px rgba(0,0,0,.22);
          display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:14px; padding:24px 18px; overflow:hidden; }
  .card h2 { font-weight:400; font-size:24px; line-height:1.15; }
  .card h2 b { font-weight:700; }
  .ring { width:160px; height:160px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:6px; }
  .ring strong { font-size:15px; font-weight:700; letter-spacing:1px; line-height:1.2; }
  .phone { font-size:14px; font-weight:500; letter-spacing:.5px; opacity:.85; }
  .cta { font-size:12px; font-weight:500; letter-spacing:2.5px; }
  .nfc { width:84px; height:66px; margin-bottom:-8px; }
  .serif { font-family:"Playfair Display",serif; }

  /* PRETO CLÁSSICO */
  .a { background:#0d0d0d; color:#fff; }
  .a .ring { border:6px solid #fff; }
  .a2 .ring { border-width:3px; box-shadow:0 0 0 7px #0d0d0d, 0 0 0 10px #fff; }
  .a3 .ring { border:6px dashed #fff; }
  .a4 { background:#fff; color:#0d0d0d; border:1px solid #ddd; }
  .a4 .ring { border-color:#0d0d0d; }
  .a5 .ring { border:none; background:#fff; color:#0d0d0d; }
  .big { font-size:54px; font-weight:800; line-height:1; letter-spacing:-2px; }

  /* EXECUTIVO DOURADO */
  .b { background:linear-gradient(160deg,#1c1c1c,#000); color:#f1f1f1; }
  .gold { color:#d4af37; }
  .b .ring { border:3px solid #d4af37; width:130px; height:130px; }
  .b .nfc { color:#d4af37; }
  .b .label { font-size:13px; letter-spacing:5px; font-weight:500; color:#d4af37; }
  .b .name { font-size:28px; font-weight:300; letter-spacing:1px; }
  .b .rule { width:40px; height:1px; background:#d4af37; }
  .b2 .ring { box-shadow:0 0 0 6px #111, 0 0 0 7px #d4af37; }
  .b3 .name { font-family:"Playfair Display",serif; font-weight:500; font-size:30px; }
  .b4 { background:linear-gradient(145deg,#f3d77a,#c9a227 55%,#a8831a); color:#111; }
  .b4 .label, .b4 .gold { color:#111; }
  .b4 .ring { border-color:#111; }
  .b4 .nfc { color:#111; }
  .b4 .rule { background:#111; }
  .b5::before { content:""; position:absolute; inset:12px; border:1px solid #d4af37; border-radius:14px; pointer-events:none; }
  .mono { font-family:"Playfair Display",serif; font-size:52px; font-weight:500; color:#d4af37; letter-spacing:2px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="nfc" viewBox="0 0 170 130">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M90 18 H33 a28 28 0 0 0 0 56 H100"/>
      <path d="M38 38 q6 8 0 16"/><path d="M48 32 q11 14 0 28"/><path d="M58 26 q16 20 0 40"/>
      <rect x="88" y="4" width="40" height="80" rx="6" transform="rotate(-14 108 44)"/>
      <path d="M103 14 l12 -3"/><path d="M96 62 q-8 -2 -8 6 q2 6 10 2 l14 4"/>
      <path d="M100 82 q4 20 24 18 q14 -2 14 -18"/><path d="M134 48 q8 0 6 8 q8 2 4 10 q8 4 0 12"/>
      <path d="M112 106 l-4 20"/><path d="M134 98 l8 16"/>
    </g>
  </symbol>
  <symbol id="car" viewBox="0 0 84 50">
    <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 34 V26 l8-4 10-12 h30 l12 12 h8 a4 4 0 0 1 4 4 v8 h-6"/><path d="M28 34 h26"/><path d="M6 34 h6"/>
      <circle cx="20" cy="36" r="7"/><circle cx="62" cy="36" r="7"/><path d="M26 22 h40"/>
    </g>
  </symbol>
  <symbol id="wheel" viewBox="0 0 70 70">
    <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round">
      <circle cx="35" cy="35" r="28"/><circle cx="35" cy="35" r="7"/>
      <path d="M8 31 q27-10 54 0"/><path d="M31 42 l-6 20"/><path d="M39 42 l6 20"/>
    </g>
  </symbol>
  <symbol id="pin" viewBox="0 0 50 64">
    <g fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round">
      <path d="M25 60 C10 42 4 32 4 23 a21 21 0 0 1 42 0 c0 9-6 19-21 37z"/><circle cx="25" cy="23" r="8"/>
    </g>
  </symbol>
</svg>

<h1>PRETO CLÁSSICO</h1>
<div class="grid">
  <figure><div class="card a a1">
    <h2>Precisa de uma<br><b>corrida</b>?</h2>
    <div class="ring"><svg width="70" height="42"><use href="#car"/></svg><strong>MOTORISTA<br>PARTICULAR</strong></div>
    <div class="phone">(00) 00000-0000</div>
    <svg class="nfc"><use href="#nfc"/></svg><p class="cta">APROXIME SEU CELULAR</p>
  </div><figcaption>A1 · ORIGINAL</figcaption></figure>

  <figure><div class="card a a2">
    <h2>Sua corrida a<br>um <b>toque</b></h2>
    <div class="ring"><svg width="54" height="54"><use href="#wheel"/></svg><strong>SEU NOME</strong></div>
    <div class="phone">(00) 00000-0000</div>
    <svg class="nfc"><use href="#nfc"/></svg><p class="cta">APROXIME SEU CELULAR</p>
  </div><figcaption>A2 · ANEL DUPLO</figcaption></figure>

  <figure><div class="card a a4">
    <h2>Precisa de uma<br><b>corrida</b>?</h2>
    <div class="ring"><svg width="70" height="42"><use href="#car"/></svg><strong>MOTORISTA<br>PARTICULAR</strong></div>
    <div class="phone">(00) 00000-0000</div>
    <svg class="nfc"><use href="#nfc"/></svg><p class="cta">APROXIME SEU CELULAR</p>
  </div><figcaption>A4 · INVERTIDO BRANCO</figcaption></figure>
</div>

<h1>EXECUTIVO DOURADO</h1>
<div class="grid">
  <figure><div class="card b b1">
    <p class="label">EXECUTIVO</p>
    <div class="ring"><svg class="gold" width="56" height="56"><use href="#wheel"/></svg></div>
    <div class="name">Seu Nome</div>
    <div class="phone gold">(00) 00000-0000</div>
    <svg class="nfc"><use href="#nfc"/></svg><p class="cta">APROXIME SEU CELULAR</p>
  </div><figcaption>B1 · ORIGINAL</figcaption></figure>

  <figure><div class="card b b2">
    <p class="label">MOTORISTA EXECUTIVO</p>
    <div class="ring"><svg class="gold" width="70" height="42"><use href="#car"/></svg></div>
    <div class="name">Seu Nome</div>
    <div class="phone gold">(00) 00000-0000</div>
    <svg class="nfc"><use href="#nfc"/></svg><p class="cta">APROXIME SEU CELULAR</p>
  </div><figcaption>B2 · ANEL DUPLO</figcaption></figure>

  <figure><div class="card b b4">
    <p class="label">EXECUTIVO</p>
    <div class="ring"><svg width="56" height="56"><use href="#wheel"/></svg></div>
    <div class="name" style="font-weight:500">Seu Nome</div>
    <div class="phone">(00) 00000-0000</div>
    <svg class="nfc"><use href="#nfc"/></svg><p class="cta">APROXIME SEU CELULAR</p>
  </div><figcaption>B4 · FUNDO DOURADO</figcaption></figure>
</div>
</body>
</html>
