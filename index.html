<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Contas em Dia</title>
<meta name="theme-color" content="#2E43B8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Contas em Dia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icone.png">
<link rel="icon" type="image/png" href="icone.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0}
@supports (font:-apple-system-body){html{font:-apple-system-body}}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:root{
--bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#ECEEF4; --ink:#151A2D; --muted:#5D6478; --line:#E4E7EE;
--accent:#3446C9; --accent-ink:#FFFFFF; --accent-soft:#E7EAFC;
--in:#0F7A57; --in-soft:#DFF4EB; --out:#C0392B; --out-soft:#FBE6E3;
--warn:#946000; --warn-soft:#FDF1D8;
--hero-a:#2B3BB0; --hero-b:#4A5BE0; --hero-in:#B9F2D9; --hero-out:#FFD0C9;
--tab-sel:#FFFFFF; --shadow:0 1px 2px rgba(21,26,45,.04),0 4px 16px rgba(21,26,45,.06);
--display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
--body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
--bg:#0E1117; --surface:#181C26; --surface-2:#222735; --ink:#EAEDF4; --muted:#9CA4B6; --line:#2A3041;
--accent:#8E9BFF; --accent-ink:#0F1430; --accent-soft:#252C52;
--in:#5FD3A6; --in-soft:#163A2E; --out:#FF8A7D; --out-soft:#3D2220;
--warn:#F2B84B; --warn-soft:#3A2E14;
--hero-a:#232D80; --hero-b:#3443AE; --shadow:none; --tab-sel:#363D52; color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#0E1117; --surface:#181C26; --surface-2:#222735; --ink:#EAEDF4; --muted:#9CA4B6; --line:#2A3041;
--accent:#8E9BFF; --accent-ink:#0F1430; --accent-soft:#252C52;
--in:#5FD3A6; --in-soft:#163A2E; --out:#FF8A7D; --out-soft:#3D2220;
--warn:#F2B84B; --warn-soft:#3A2E14;
--hero-a:#232D80; --hero-b:#3443AE; --shadow:none; --tab-sel:#363D52; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:.9375rem;line-height:1.45;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.num{font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-weight:800;font-size:1.75rem;letter-spacing:-.02em;margin:0;line-height:1.1}
h2{font-family:var(--display);font-weight:600;font-size:1.1rem;margin:0}
.sec-title{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:6px 2px -4px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header{display:flex;flex-direction:column;gap:2px;padding:0 2px}
.c-in{color:var(--in)} .c-out{color:var(--out)}
/* resumo */
.hero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(43,59,176,.25)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero-label{font-size:.85rem;font-weight:500;opacity:.85}
.hero-saldo{font-family:var(--display);font-weight:800;font-size:2.4rem;letter-spacing:-.02em;line-height:1;overflow-wrap:anywhere}
.hero .c-in{color:var(--hero-in)} .hero .c-out{color:var(--hero-out)}
.hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:flex;flex-direction:column;gap:8px;background:rgba(255,255,255,.12);border-radius:16px;padding:12px;min-width:0}
.stat div{display:flex;flex-direction:column;min-width:0}
.stat small{font-size:.75rem;opacity:.85}
.stat b{font-size:1.1rem;font-weight:700;color:#fff}
.stat .ico{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18)}
.stat .ico svg{width:16px;height:16px}
.prog{display:flex;flex-direction:column;gap:6px}
.prog .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .3s}
.prog small{font-size:.8rem;opacity:.9}
/* avisos */
.alerts{display:flex;flex-direction:column;gap:10px}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);border-left:4px solid var(--warn)}
.alert.late{border-left-color:var(--out)}
.alert .dot{width:10px;height:10px;border-radius:50%;background:var(--warn);flex:none}
.alert.late .dot{background:var(--out)}
.alert div{flex:1;min-width:0}
.alert b{display:block;font-weight:600}
.alert span{font-size:.82rem;color:var(--muted)}
.alert .v{font-weight:700;white-space:nowrap}
.alert .v.c-in{color:var(--in)} .alert .v.c-out{color:var(--out)}
.alert .btn{padding:8px 14px;min-height:40px}
/* abas */
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;background:var(--surface-2);border-radius:99px;padding:4px;gap:2px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-weight:600;font-size:.9rem;flex:1 0 auto;min-height:40px;border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--tab-sel);color:var(--ink);box-shadow:0 1px 4px rgba(21,26,45,.12)}
/* lista */
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.group-label{margin:0;font-family:var(--body);padding:14px 16px 2px;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.row{position:relative}
.row + .row::before{content:"";position:absolute;top:0;left:68px;right:16px;border-top:1px solid var(--line)}
.row-main{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:64px;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.row-main:active{background:var(--bg)}
.row-main:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.avatar{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
.avatar svg{width:20px;height:20px}
.avatar.in{background:var(--in-soft);color:var(--in)}
.avatar.out{background:var(--out-soft);color:var(--out)}
.avatar.done{background:var(--surface-2);color:var(--muted)}
.row-info{flex:1;min-width:0}
.row-info b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;overflow-wrap:anywhere}
.row-info span{font-size:.82rem;color:var(--muted)}
.nw{white-space:nowrap}
.row-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row-right strong{font-weight:700;white-space:nowrap}
.pill{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--surface-2);color:var(--muted)}
.pill.done{background:var(--in-soft);color:var(--in)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.late{background:var(--out-soft);color:var(--out)}
.row-panel{padding:0 16px 16px 68px;display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inline label{font-size:.82rem;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0;width:100%;font-size:max(16px,1em)}
.btn{font:inherit;font-weight:600;font-size:.9rem;min-height:44px;border-radius:12px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active,.btn:active{opacity:.75}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--out);border-color:var(--out)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.empty{padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--ink);font-family:var(--display);font-weight:600;font-size:1.05rem}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);border:0;border-radius:20px;box-shadow:0 8px 24px rgba(43,59,176,.35);cursor:pointer;z-index:5}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.94)}
/* formulário */
.sheet{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.seg button{font:inherit;font-size:.85rem;font-weight:600;min-height:44px;padding:9px 6px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.note{font-size:.8rem;color:var(--muted);margin:0 2px}
/* assistente */
.assist{background:var(--surface);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.assist-start{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;background:var(--surface);color:var(--ink);border:0;border-radius:20px;padding:12px 16px;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.assist-start .ico{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.assist-start .ico svg{width:22px;height:22px}
.assist-start > span:nth-child(2){flex:1;min-width:0}
.assist-start small{display:block;font-weight:500;font-size:.82rem;color:var(--muted)}
.assist-start .chev{flex:none;width:18px;height:18px;color:var(--muted)}
.assist-top{display:flex;justify-content:space-between;align-items:center}
.assist-q{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.25;margin:0;text-wrap:balance}
.assist-ex{margin:0;font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;font-size:.9rem;padding:10px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.resp{display:flex;gap:8px;align-items:center}
.resp input{flex:1}
.mic{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--out);animation:pulso 1s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.08)}}
.ouvindo{font-size:.85rem;color:var(--out);font-weight:600;margin:0}
.disse{margin:0;font-size:.85rem;color:var(--muted);font-style:italic}
.modelo{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:14px;padding:12px 14px;margin:0;list-style:none}
.modelo li{font-size:.92rem}
.modelo b{color:var(--accent)}
.ficha{display:flex;flex-direction:column;gap:10px}
.fala-app{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:16px 16px 16px 4px;padding:12px 14px;margin:0}
.fala-app b{font-family:var(--display);font-weight:600}
.fala-eu{align-self:flex-end;max-width:90%;background:var(--accent);color:var(--accent-ink);border-radius:16px 16px 4px 16px;padding:10px 14px;margin:0;font-size:.92rem}
.lista-voz{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lv-item{display:flex;align-items:center;flex-wrap:wrap;row-gap:2px;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.lv-item:first-child{border-top:0}
.lv-item div{flex:1 1 100%;min-width:0}
.lv-item b{display:block;font-weight:600;overflow-wrap:anywhere}
.lv-item span{font-size:.8rem;color:var(--muted)}
.lv-item .falta{color:var(--out);font-weight:600}
.lv-item strong{white-space:nowrap;margin-right:auto}
.lv-item .btn{padding:6px 10px}
.pensando{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;margin:0}
.pensando i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
/* mais opções */
.menu{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.menu-item:not(:first-child)::before{content:"";position:absolute;top:0;left:68px;right:16px;border-top:1px solid var(--line)}
.menu-item:active{background:var(--bg)}
.menu-item .avatar{background:var(--accent-soft);color:var(--accent)}
.menu-item > span:nth-child(2){flex:1;min-width:0}
.menu-item b{display:block;font-weight:600}
.menu-item small{display:block;font-size:.82rem;color:var(--muted)}
.menu-item .chev{flex:none;width:18px;height:18px;color:var(--muted)}
.menu-note{margin:0;padding:0 16px 14px 68px;font-size:.82rem;color:var(--muted)}
.err{color:var(--out);font-size:.85rem}
.toast:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:.9rem;z-index:6;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (prefers-reduced-motion:no-preference){.row-panel,.sheet{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
<header>
<span class="eyebrow" id="hoje"></span>
<h1>Contas em Dia</h1>
</header>
<section class="hero" aria-label="Resumo do mês">
<span class="hero-label" id="sMes">Saldo previsto</span>
<strong class="num hero-saldo" id="sSaldo">—</strong>
<div class="hero-stats">
<div class="stat"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7 7 17M7 9v8h8"/></svg></span><div><small>Entradas</small><b class="num" id="sEnt">—</b><small class="num" id="sEntR"></small></div></div>
<div class="stat"><span class="ico" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg></span><div><small>Saídas</small><b class="num" id="sSai">—</b><small class="num" id="sSaiR"></small></div></div>
</div>
<div class="prog"><div class="bar" id="pBarWrap" role="progressbar" aria-label="Contas pagas no mês" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"><i id="pBar" style="width:0%"></i></div><small class="num" id="pTxt"></small></div>
</section>
<section id="assist" aria-label="Assistente de voz" aria-live="polite"></section>
<section id="alertsWrap" aria-label="Avisos" hidden>
<div class="alerts" id="alerts"></div>
</section>
<div id="sheetHost"></div>
<h2 class="sec-title">Suas contas</h2>
<div class="tabs" role="tablist" aria-label="Tipos de conta">
<button role="tab" id="tab-fixo" aria-controls="list" aria-selected="true" tabindex="0">Fixos</button>
<button role="tab" id="tab-variavel" aria-controls="list" aria-selected="false" tabindex="-1">Variáveis</button>
<button role="tab" id="tab-semanal" aria-controls="list" aria-selected="false" tabindex="-1">Semanais</button>
<button role="tab" id="tab-quinzenal" aria-controls="list" aria-selected="false" tabindex="-1">Quinzenais</button>
<button role="tab" id="tab-avulso" aria-controls="list" aria-selected="false" tabindex="-1">Avulsos</button>
</div>
<section class="list" id="list" role="tabpanel" aria-labelledby="tab-fixo"></section>
<p class="note" id="tabNote"></p>
<h2 class="sec-title">Mais opções</h2>
<div class="menu">
<button class="menu-item" type="button" id="calExportar"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span><span><b>Lembretes no calendário</b><small>Aviso na véspera e no dia de cada conta</small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
<p class="menu-note" id="calDica" hidden>Se mudar ou excluir uma conta, apague os eventos antigos no Calendário e adicione de novo.</p>
<button class="menu-item" type="button" id="bkSalvar"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span><span><b>Salvar cópia de segurança</b><small>Guarda suas contas num arquivo</small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button>
<label class="menu-item" for="bkArquivo" tabindex="0"><span class="avatar" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg></span><span><b>Restaurar cópia</b><small>Traz de volta as contas de um arquivo</small></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></label>
<input type="file" id="bkArquivo" accept="application/json,.json" hidden>
<div class="inline menu-note" id="bkConfirma" hidden>
<span id="bkMsg"></span>
<button class="btn danger" type="button" id="bkSim">Substituir minhas contas</button>
<button class="btn ghost" type="button" id="bkNao">Cancelar</button>
</div>
</div>
<p class="note">Suas contas ficam guardadas só neste celular. Salve uma cópia de vez em quando para não perder nada se trocar de aparelho.</p>
</div>
<button class="fab" id="fab" type="button" aria-label="Adicionar conta" title="Adicionar conta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const DIAS=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
const DIAS_CURTO=["dom","seg","ter","qua","qui","sex","sáb"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const AVISO={mensal:5,semanal:1};
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parseValor(s){
s=String(s||"").replace(/[R$\s]/g,"");
if(s.includes(",")) s=s.replace(/\./g,"").replace(",",".");
const n=parseFloat(s); return isFinite(n)&&n>=0?Math.round(n*100)/100:NaN;
}
const fmtInput=v=>(Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
function hoje(){const d=new Date();d.setHours(0,0,0,0);return d}
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fromYmd=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const diffDias=(a,b)=>Math.round((a-b)/864e5);
const dm=d=>`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
const diasNoMes=(y,m)=>new Date(y,m+1,0).getDate();
const occMes=(dia,y,m)=>new Date(y,m,Math.min(dia,diasNoMes(y,m)));
function occSemana(dow,ref){const seg=new Date(ref);seg.setDate(seg.getDate()-((seg.getDay()+6)%7));const d=new Date(seg);d.setDate(seg.getDate()+((dow+6)%7));return d}
const isMensal=it=>it.tipo==="fixo"||it.tipo==="variavel";
const isEntrada=it=>it.sentido==="entrada";
const isQuinz=it=>it.tipo==="quinzenal";
function occQuinz(anc,ref){const a=fromYmd(anc);const k=Math.floor(diffDias(ref,a)/14);const d=new Date(a);if(k>0)d.setDate(a.getDate()+14*k);return d}
const noMes=(it,y,m)=>{const d=fromYmd(it.data);return d.getFullYear()===y&&d.getMonth()===m};
let itens=[], pagos={}, db=null, pronto=false, aba="fixo", aberto=null, editando=null, confirmarExcluir=null;
const pagoKey=(id,data)=>`${id}__${data}`;
const LS="contas-em-dia-v1";
function lsLoad(){try{const s=JSON.parse(localStorage.getItem(LS)||"{}");itens=s.itens||[];pagos=s.pagos||{}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({itens,pagos}))}catch(e){}}
async function salvarItem(it){
const i=itens.findIndex(x=>x.id===it.id);i>=0?itens[i]=it:itens.push(it);lsSave();render()
}
async function excluirItem(id){
if(db){await db.collection("itens").doc(id).delete();
for(const k of Object.keys(pagos)) if(pagos[k].item===id) await db.collection("pagos").doc(k).delete();}
else{itens=itens.filter(x=>x.id!==id);for(const k of Object.keys(pagos)) if(pagos[k].item===id) delete pagos[k];lsSave();render()}
}
async function marcarPago(it,data,valor){
const k=pagoKey(it.id,data), body={item:it.id,data,valor,em:ymd(hoje())};
if(db){await db.collection("pagos").doc(k).set(body)} else {pagos[k]=body;lsSave();render()}
}
async function desfazer(it,data){
const k=pagoKey(it.id,data);
if(db){await db.collection("pagos").doc(k).delete()} else {delete pagos[k];lsSave();render()}
}
function primeiraParcela(it){const c=fromYmd(it.criado||ymd(hoje()));let d;
if(isQuinz(it)){d=occQuinz(it.data,c);if(d<c)d.setDate(d.getDate()+14);return d}
if(it.tipo==="semanal"){d=occSemana(it.dia,c);if(d<c)d.setDate(d.getDate()+7);return d}
d=occMes(it.dia,c.getFullYear(),c.getMonth());if(d<c)d=occMes(it.dia,c.getFullYear(),c.getMonth()+1);return d}
function numParcela(it,d){const f=primeiraParcela(it);
if(isQuinz(it))return Math.round(diffDias(d,f)/14)+1;
if(it.tipo==="semanal")return Math.round(diffDias(d,f)/7)+1;
return (d.getFullYear()-f.getFullYear())*12+(d.getMonth()-f.getMonth())+1}
const aceitaParcelas=t=>t==="fixo"||t==="semanal"||t==="quinzenal";
const temParcelas=it=>aceitaParcelas(it.tipo)&&it.parcelas>0;
function status(it){
const t=hoje();
if(it.tipo==="avulso") return {kind:"done",label:dm(fromYmd(it.data)),avulso:true};
let cur,next,lim;
if(isMensal(it)){cur=occMes(it.dia,t.getFullYear(),t.getMonth());next=occMes(it.dia,t.getFullYear(),t.getMonth()+1);lim=AVISO.mensal}
else if(isQuinz(it)){cur=occQuinz(it.data,t);next=new Date(cur);next.setDate(cur.getDate()+14);lim=AVISO.semanal}
else{cur=occSemana(it.dia,t);next=new Date(cur);next.setDate(cur.getDate()+7);lim=AVISO.semanal}
if(it.criado&&ymd(cur)<it.criado&&!pagos[pagoKey(it.id,ymd(cur))]){const d=diffDias(next,t);
return d<=lim?{kind:"warn",data:next,dias:d,label:d===0?"Vence hoje":d===1?"Amanhã":`Em ${d} dias`}:{kind:"ok",data:next,dias:d,label:`Em ${d} dias`}}
if(temParcelas(it)&&numParcela(it,cur)>it.parcelas&&!pagos[pagoKey(it.id,ymd(cur))])return {kind:"done",label:"Quitado",quitado:true,data:cur};
const pc=pagos[pagoKey(it.id,ymd(cur))];
if(!pc){
const d=diffDias(cur,t);
if(d<0) return {kind:"late",data:cur,dias:d,label:`Atrasado ${-d} dia${d===-1?"":"s"}`};
if(d<=lim) return {kind:"warn",data:cur,dias:d,label:d===0?"Vence hoje":d===1?"Amanhã":`Em ${d} dias`};
return {kind:"ok",data:cur,dias:d,label:`Em ${d} dias`};
}
const d=diffDias(next,t);
if(temParcelas(it)&&numParcela(it,next)>it.parcelas)return {kind:"done",label:"Quitado",quitado:true,data:cur,pago:pc};
if(d<=lim && !pagos[pagoKey(it.id,ymd(next))]) return {kind:"warn",data:next,dias:d,label:d===0?"Vence hoje":d===1?"Amanhã":`Em ${d} dias`,anterior:cur};
return {kind:"done",data:cur,label:isEntrada(it)?"Recebido":"Pago",pago:pc,proxima:next};
}
function quando(it){
if(it.tipo==="avulso") return `${isEntrada(it)?"Entrada avulsa":"Gasto avulso"} · ${DIAS_CURTO[fromYmd(it.data).getDay()]} ${dm(fromYmd(it.data))}`;
if(isMensal(it)) return (isEntrada(it)?`Entra todo dia ${it.dia}`:`Vence todo dia ${it.dia}`)+(temParcelas(it)?` · ${it.parcelas}x`:"");
const px=temParcelas(it)?` · ${it.parcelas}x`:"";
if(isQuinz(it)) return `${isEntrada(it)?"Entra":"Sai"} a cada 15 dias`+px;
return `${isEntrada(it)?"Entra":"Sai"} toda ${DIAS[it.dia]}`+px;
}
function resumo(){
const t=hoje(),y=t.getFullYear(),m=t.getMonth(),n=diasNoMes(y,m);
let entPrev=0,saiPrev=0,entReal=0,saiReal=0,falta=0,nPagas=0,nTotal=0;
for(const it of itens){
if(it.tipo==="avulso"){if(noMes(it,y,m)){if(isEntrada(it)){entPrev+=it.valor;entReal+=it.valor}else{saiPrev+=it.valor;saiReal+=it.valor}}continue}
const datas=[];
if(isMensal(it)) datas.push(occMes(it.dia,y,m));
else if(isQuinz(it)){let d=occQuinz(it.data,new Date(y,m,1));if(d<new Date(y,m,1))d.setDate(d.getDate()+14);while(d.getMonth()===m&&d.getFullYear()===y){datas.push(new Date(d));d.setDate(d.getDate()+14)}}
else for(let d=1;d<=n;d++){const x=new Date(y,m,d);if(x.getDay()===it.dia)datas.push(x)}
for(const d of datas){
const p=pagos[pagoKey(it.id,ymd(d))];
if(!p&&it.criado&&ymd(d)<it.criado)continue;
if(temParcelas(it)&&numParcela(it,d)>it.parcelas&&!p)continue;
const prev=p?p.valor:it.valor;
if(isEntrada(it)){entPrev+=prev;if(p)entReal+=p.valor}
else{saiPrev+=prev;nTotal++;if(p){saiReal+=p.valor;nPagas++}else falta+=it.valor}
}
}
$("sEnt").textContent=brl(entPrev);$("sEntR").textContent=`${brl(entReal)} recebido`;
$("sSai").textContent=brl(saiPrev);$("sSaiR").textContent=`${brl(saiReal)} pago`;
$("pBar").style.width=(nTotal?Math.round(nPagas/nTotal*100):0)+"%";
const pb=$("pBarWrap");pb.setAttribute("aria-valuemax",nTotal);pb.setAttribute("aria-valuenow",nPagas);pb.setAttribute("aria-valuetext",`${nPagas} de ${nTotal} contas pagas`);
$("pTxt").textContent=nTotal?`${nPagas} de ${nTotal} contas pagas em ${MESES[m]}`+(falta>0?` · falta pagar ${brl(falta)}`:" · tudo pago 🎉"):(itens.length?`Nenhuma conta a pagar em ${MESES[m]}`:"Cadastre suas contas para acompanhar o mês");
const saldo=entPrev-saiPrev;
$("sSaldo").textContent=brl(saldo);$("sSaldo").className="num hero-saldo "+(saldo<0?"c-out":"");
$("sMes").textContent=`Saldo previsto de ${MESES[m]}`;
}
function renderAvisos(){
const lista=itens.map(it=>({it,s:status(it)})).filter(x=>x.s.kind==="warn"||x.s.kind==="late")
.sort((a,b)=>a.s.dias-b.s.dias);
$("alertsWrap").hidden=!lista.length&&!precisaBackup();
$("alerts").innerHTML=lista.map(({it,s})=>`
<div class="alert ${s.kind==="late"?"late":""}"><span class="dot"></span>
<div><b>${esc(it.nome)}</b><span>${s.kind==="late"?s.label:(isEntrada(it)?"Entra ":"Vence ")+(s.dias===0?"hoje":s.dias===1?"amanhã":`em ${s.dias} dias`)} · ${DIAS_CURTO[s.data.getDay()]} ${dm(s.data)}</span></div>
<span class="v num ${isEntrada(it)?"c-in":"c-out"}"><span class="sr">${isEntrada(it)?"entrada de":"saída de"} </span><span aria-hidden="true">${isEntrada(it)?"+ ":"− "}</span>${brl(it.valor)}</span></div>`).join("")+avisoBackup();
}
const LS_BK="contas-em-dia-backup";
function ultimoBackup(){try{return localStorage.getItem(LS_BK)}catch(e){return null}}
function precisaBackup(){if(!itens.length)return false;const u=ultimoBackup();return !u||diffDias(hoje(),fromYmd(u))>30}
function avisoBackup(){if(!precisaBackup())return "";const u=ultimoBackup();
return `<div class="alert"><span class="dot"></span><div><b>Salve uma cópia das suas contas</b><span>${u?`A última foi em ${dm(fromYmd(u))}.`:"Você ainda não salvou nenhuma."} Os dados ficam só neste celular.</span></div><button class="btn" type="button" data-act="backup">Salvar</button></div>`}
const ICO=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const ICO_IN=ICO("M17 7 7 17M7 9v8h8"),ICO_OUT=ICO("M7 17 17 7M9 7h8v8"),ICO_OK=ICO("m5 12 5 5 9-10");
function rowHtml(it){
const s=status(it), open=aberto===it.id, ent=isEntrada(it);
const valorMostrado=s.kind==="done"&&s.pago?s.pago.valor:it.valor;
let sub=quando(it);
if(temParcelas(it)){const k=Math.max(1,Math.min(numParcela(it,s.data),it.parcelas)),falta=it.parcelas-k+(s.kind==="done"?0:1);
const base=isMensal(it)?`Dia ${it.dia}`:isQuinz(it)?"A cada 15 dias":`Toda ${DIAS[it.dia]}`;
sub=`${base} · <span class="nw">parcela ${k}/${it.parcelas}</span> · <span class="nw">${falta>0?`falta${falta>1?"m":""} ${falta}`:"última paga"}</span>`}
if(s.quitado) sub=`${it.parcelas} parcelas · ${ent?"tudo recebido":"tudo pago"}`;
else if(s.kind==="done"&&!s.avulso&&s.proxima) sub+=` · próxima ${dm(s.proxima)}`;
if(it.tipo==="avulso") sub=quando(it);
let panel="";
if(open){
const verbo=ent?"Recebi":"Paguei";
const dataAlvo=ymd(s.data);
if(s.avulso){
panel=`<div class="inline"><button class="btn" data-act="editar" data-id="${it.id}">Editar</button>${delBtn(it)}</div>`;
}else if(s.quitado){
panel=`<div class="inline"><span class="note">${ent?"Todas as parcelas foram recebidas.":"Todas as parcelas foram pagas."}</span></div><div class="inline"><button class="btn ghost" data-act="editar" data-id="${it.id}">Editar</button>${delBtn(it)}</div>`;
}else if(s.kind==="done"){
panel=`<div class="inline"><span class="note">${ent?"Recebido":"Pago"} ${brl(s.pago.valor)} em ${dm(fromYmd(s.pago.em))}</span></div>
<div class="inline"><button class="btn" data-act="desfazer" data-id="${it.id}" data-data="${ymd(s.data)}">Desfazer</button>
<button class="btn ghost" data-act="editar" data-id="${it.id}">Editar</button>${delBtn(it)}</div>`;
}else{
panel=`<div class="field"><label for="v-${it.id}">${verbo} quanto? (${dm(s.data)})</label>
<input id="v-${it.id}" inputmode="decimal" value="${fmtInput(it.valor)}"></div>
<div class="inline"><button class="btn primary" data-act="pagar" data-id="${it.id}" data-data="${dataAlvo}">${verbo}</button>
<button class="btn ghost" data-act="editar" data-id="${it.id}">Editar</button>${delBtn(it)}</div>`;
}
}
return `<div class="row"><button class="row-main" data-act="abrir" data-id="${it.id}" aria-expanded="${open}"><span class="avatar ${s.kind==="done"&&!s.avulso?"done":ent?"in":"out"}" aria-hidden="true">${s.kind==="done"&&!s.avulso?ICO_OK:ent?ICO_IN:ICO_OUT}</span>
<div class="row-info"><b>${esc(it.nome)}</b><span>${sub}</span></div>
<div class="row-right"><strong class="num ${ent?"c-in":"c-out"}"><span class="sr">, ${ent?"entrada de":"saída de"} </span><span aria-hidden="true">${ent?"+ ":"− "}</span>${brl(valorMostrado)}</strong>${s.avulso?"":`<span class="pill ${s.kind}"><span class="sr">, </span>${s.label}</span>`}</div>
</button>${open?`<div class="row-panel">${panel}</div>`:""}</div>`;
}
function delBtn(it){
return confirmarExcluir===it.id
? `<button class="btn danger" data-act="excluir-sim" data-id="${it.id}">Confirmar exclusão</button><button class="btn ghost" data-act="excluir-nao">Manter</button>`
: `<button class="btn ghost" data-act="excluir" data-id="${it.id}">Excluir</button>`;
}
function renderLista(){
const L=$("list");
if(!pronto){L.innerHTML=`<div class="empty"><b>Carregando suas contas…</b></div>`;return}
const T=hoje();
const doTipo=itens.filter(it=>it.tipo===aba&&(aba!=="avulso"||noMes(it,T.getFullYear(),T.getMonth())));
const ordenar=a=>a.map(it=>({it,s:status(it)})).sort((x,y)=>((x.s.kind==="done")-(y.s.kind==="done"))||((x.s.data||0)-(y.s.data||0))).map(x=>x.it);
const vazio={
fixo:["Nada fixo ainda","Aluguel, internet, prestações ou uma entrada que cai todo mês com o mesmo valor. Toque no botão +."],
variavel:["Nenhum gasto variável ainda","Luz, água, cartão de crédito: contas que vencem todo mês mas mudam de valor. Toque no botão +."],
avulso:["Nenhum avulso neste mês","Gastos ou entradas que não se repetem: um conserto, uma venda extra, um presente. Toque no botão +."],
quinzenal:["Nada quinzenal ainda","Entradas e saídas que se repetem a cada 15 dias, como um brique de quinzena. Toque no botão +."],
semanal:["Nada semanal ainda","Entradas e saídas que se repetem toda semana, como pagamento recebido na sexta ou compra de mercadoria. Toque no botão +."]
}[aba];
if(!doTipo.length){L.innerHTML=`<div class="empty"><b>${vazio[0]}</b><span>${vazio[1]}</span></div>`}
else if(aba!=="avulso"&&doTipo.some(isEntrada)){
const ent=ordenar(doTipo.filter(isEntrada)), sai=ordenar(doTipo.filter(x=>!isEntrada(x)));
L.innerHTML=(sai.length?`<h3 class="group-label">Saídas</h3>`+sai.map(rowHtml).join(""):"")+
(ent.length?`<h3 class="group-label">Entradas</h3>`+ent.map(rowHtml).join(""):"");
} else if(aba==="avulso"){L.innerHTML=doTipo.slice().sort((a,b)=>b.data.localeCompare(a.data)).map(rowHtml).join("")}
else L.innerHTML=ordenar(doTipo).map(rowHtml).join("");
const tot=doTipo.reduce((a,b)=>a+(isEntrada(b)?0:b.valor),0);
if(aba==="avulso"){const e=doTipo.filter(isEntrada).reduce((a,b)=>a+b.valor,0),g=doTipo.filter(x=>!isEntrada(x)).reduce((a,b)=>a+b.valor,0);
$("tabNote").textContent=`Neste mês: ${brl(e)} de entradas e ${brl(g)} de gastos avulsos.`;return}
$("tabNote").textContent= (aba==="semanal"||aba==="quinzenal") ? `Aviso 1 dia antes. Toque numa linha para marcar como pago ou recebido.`
: (doTipo.some(isEntrada)?`Por mês: entra ${brl(doTipo.filter(isEntrada).reduce((a,b)=>a+b.valor,0))} e sai ${brl(tot)}. Aviso 5 dias antes.`:`Total ${brl(tot)} por mês. Aviso 5 dias antes do vencimento.`);
}

const FORM_TIPOS=[["fixo","saida","Gasto fixo mensal"],["fixo","entrada","Entrada mensal"],["variavel","saida","Gasto variável"],["semanal","entrada","Entrada semanal"],["semanal","saida","Saída semanal"],["quinzenal","entrada","Entrada quinzenal"],["quinzenal","saida","Saída quinzenal"],["avulso","saida","Gasto avulso"],["avulso","entrada","Entrada avulsa"]];

function lerForm(){

});
$("sheetHost").addEventListener("submit",async e=>{

<div class="lista-voz">${A.lista.map((x,i)=>{const f=faltaEm(x);return `<div class="lv-item"><div><b>${x.tipo==="pagar"?"Pago: "+esc(x.item?x.item.nome:"conta"):esc(x.nome||"Sem nome")}</b><span>${f.length?`<span class="falta">Falta ${f.join(" e ")}</span>`:esc(descQuando(x))}</span></div><strong class="num">${x.valor!=null?brl(x.valor):"—"}</strong><button class="btn ghost" type="button" data-a="ajustar" data-v="${i}">Ajustar</button><button class="btn ghost" type="button" data-a="tirar" data-v="${i}" aria-label="Tirar">✕</button></div>`}).join("")}</div>
${A.erro?`<p class="err">${A.erro}</p>`:""}
<div class="inline"><button class="btn primary" type="button" data-a="salvartudo">Salvar ${A.lista.length>1?"tudo":""}</button><button class="btn" type="button" data-a="denovo">Falar de novo</button></div>`;
return}
const t=A.tipo;
let campos="";
if(t==="pagar"){
const rec=itens.filter(it=>it.tipo!=="avulso");
campos=rec.length?`<div class="field"><label for="cConta">Conta</label><select id="cConta">${rec.map(it=>`<option value="${it.id}" ${A.item&&A.item.id===it.id?"selected":""}>${esc(it.nome)}</option>`).join("")}</select></div>
<div class="field"><label for="cValor">Valor pago</label><input id="cValor" inputmode="decimal" value="${A.valor!=null?fmtInput(A.valor):""}" placeholder="0,00"></div>`
:'<p class="assist-ex">Ainda não tem conta cadastrada pra marcar como paga.</p>';
}else{
let quandoCampo;
if(t.startsWith("semanal"))quandoCampo=`<div class="field"><label for="cDia">Dia da semana</label><select id="cDia"><option value="">Escolhe</option>${[1,2,3,4,5,6,0].map(d=>`<option value="${d}" ${A.dia===d?"selected":""}>${DIAS[d][0].toUpperCase()+DIAS[d].slice(1)}</option>`).join("")}</select></div>`;
else if(t.startsWith("avulso")||t.startsWith("quinzenal"))quandoCampo=`<div class="field"><label for="cData">${t.startsWith("quinzenal")?"Próxima vez":"Data"}</label><input id="cData" type="date" value="${esc(A.data||ymd(hoje()))}"></div>`;
else quandoCampo=`<div class="field"><label for="cDia">${t.endsWith("entrada")?"Dia que entra":"Dia do vencimento"}</label><input id="cDia" inputmode="numeric" placeholder="1 a 31" value="${A.dia??""}"></div>`;
const parcCampo=/^(fixo|semanal|quinzenal)/.test(t)?`<div class="field"><label for="cParc">${t.endsWith("entrada")?"Parcelas que faltam receber (se for parcelado)":"Parcelas que faltam (se for prestação)"}</label><input id="cParc" inputmode="numeric" placeholder="Vazio = sem fim" value="${A.parcelas||""}"></div>`:"";
campos=`<div class="field"><label for="cNome">Nome</label><input id="cNome" value="${esc(A.nome)}" placeholder="Ex.: aluguel"></div>
<div class="two"><div class="field"><label for="cValor">${t==="variavel"?"Valor médio (R$)":"Valor (R$)"}</label><input id="cValor" inputmode="decimal" value="${A.valor!=null?fmtInput(A.valor):""}" placeholder="0,00"></div>${quandoCampo}</div>${parcCampo}`;
}
box.innerHTML=`${topo}
${A.texto?`<p class="fala-eu">${esc(A.texto)}</p>`:""}
${A.resposta?`<p class="fala-app"><span>${esc(A.resposta)}</span></p>`:""}
<div class="chips">${TIPOS.map(([k,l])=>`<button class="chip${t===k?" sel":""}" type="button" data-a="tipo" data-v="${k}">${l}</button>`).join("")}</div>
<div class="ficha">${campos}</div>
${A.erro?`<p class="err">${A.erro}</p>`:""}
<div class="inline"><button class="btn primary" type="button" data-a="salvar">${A.voltar?"Pronto":"Salvar"}</button>${A.voltar?'<button class="btn" type="button" data-a="voltarlista">Voltar</button>':'<button class="btn" type="button" data-a="denovo">Falar de novo</button>'}</div>`;
}
function lerFicha(){
if(!A||A.fase!=="conferir")return;
const v=$("cValor");if(v)A.valor=v.value.trim()===""?null:(isNaN(parseValor(v.value))?null:parseValor(v.value));
if(A.tipo==="pagar"){const c=$("cConta");if(c)A.item=itens.find(x=>x.id===c.value)||null;return}
const n=$("cNome");if(n)A.nome=n.value.trim();
const d=$("cDia");if(d)A.dia=d.value===""?null:+d.value;
const dt=$("cData");if(dt)A.data=dt.value;
const pc=$("cParc");if(pc)A.parcelas=parseInt(pc.value,10)||null;
}
let sampleFn=null;
function faltaEm(x){const f=[];if(x.tipo==="pagar"){if(!x.item)f.push("a conta");if(x.valor==null)f.push("o valor");return f}
if(!x.nome)f.push("o nome");if(x.valor==null)f.push("o valor");if(x.tipo.startsWith("semanal")&&x.dia==null)f.push("o dia da semana");if((x.tipo.startsWith("fixo")||x.tipo.startsWith("variavel"))&&x.dia==null)f.push("o dia");if(x.tipo.startsWith("quinzenal")&&!x.data)f.push("a data");return f}
function descQuando(x){if(x.tipo==="pagar")return "vencimento "+dm(status(x.item).data);const lb=tipoLabel(x.tipo);
const px=x.parcelas?` · ${x.parcelas}x`:"";
if(x.tipo.startsWith("semanal"))return lb+" · toda "+DIAS[x.dia]+px;if(x.tipo.startsWith("avulso"))return lb+" · "+dm(fromYmd(x.data));if(x.tipo.startsWith("quinzenal"))return lb+" · a cada 15 dias, próxima "+dm(fromYmd(x.data))+px;return lb+" · todo dia "+x.dia+(x.parcelas?` · ${x.parcelas}x`:"")}
function tipoLabel(k){return (TIPOS.find(t=>t[0]===k)||[,""])[1]}
async function processar(txt){
txt=String(txt||"").trim();
if(!A)A={fase:"falar",texto:"",erro:""};
if(!txt){A.erro="Fala ou escreve primeiro.";renderAssist();return}
processarLocal(txt);
}
function processarLocal(txt){
const lista=interpretarVarios(txt);
if(!lista.length){A={fase:"falar",texto:"",erro:'Não achei nenhum valor no que tu disse. Tenta assim: "gastei 50 no mercado".'};renderAssist();return}
if(lista.length===1){const f=faltaEm(lista[0]);A={...lista[0],fase:"conferir",texto:txt,resposta:f.length?"":"Entendi assim. Confere e salva:",erro:f.length?`Só falta ${f.join(" e ")}. Completa aqui embaixo.`:""};renderAssist();return}
A={fase:"lista",lista,texto:txt,resposta:`Entendi ${lista.length} coisas. Confere e salva:`,erro:""};renderAssist();
}
function pararMic(){if(ouvindo){try{ouvindo.abort()}catch(e){}ouvindo=null}}
function ouvir(){
if(ouvindo){try{ouvindo.stop()}catch(e){}return}
if(!SR){const el=$("aTxt");if(el)el.focus();toast("Toca no microfone do teclado para falar");return}
let r;try{r=new SR()}catch(e){return}
r.lang="pt-BR";r.interimResults=true;r.continuous=true;let txt="";let silencio;
r.onresult=e=>{txt="";for(const res of e.results)txt+=res[0].transcript;const el=$("aTxt");if(el)el.value=txt;clearTimeout(silencio);silencio=setTimeout(()=>{try{r.stop()}catch(_){}} ,1800)};
r.onerror=ev=>{if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){const el=$("aTxt");if(el)el.focus();toast("Toca no microfone do teclado para falar")}};
r.onend=()=>{clearTimeout(silencio);ouvindo=null;if(!A)return;const t=(txt||($("aTxt")||{}).value||"").trim();if(t)processar(t);else renderAssist()};
try{r.start();ouvindo=r;renderAssist()}catch(e){}
}
async function salvarItemVoz(x){
if(x.tipo==="pagar"){await marcarPago(x.item,ymd(status(x.item).data),x.valor);return x.item.tipo}
const [tipo,sentido]=x.tipo.split("-");
const it={id:"c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),nome:x.nome[0].toUpperCase()+x.nome.slice(1),valor:x.valor,tipo};
if(tipo==="avulso")it.data=x.data;else if(tipo==="quinzenal"){it.data=x.data;it.criado=ymd(hoje())}else{it.dia=x.dia;it.criado=ymd(hoje())}
it.sentido=sentido||"saida";
if(aceitaParcelas(tipo)&&x.parcelas>0)it.parcelas=x.parcelas;
await salvarItem(it);return tipo;
}
async function salvarTudo(){
const ruim=A.lista.findIndex(x=>faltaEm(x).length);
if(ruim>=0){A.erro="Tem item faltando informação. Toca em Ajustar nele.";renderAssist();return}
try{let ult="fixo";for(const x of A.lista)ult=await salvarItemVoz(x);toast(A.lista.length>1?`${A.lista.length} registros salvos`:"Salvo");setAba(ult);A=null;renderAssist();render()}
catch(e){A.erro="Não consegui salvar tudo. Tenta de novo.";renderAssist()}
}
async function salvarAssist(){
lerFicha();
if(A.voltar){const f=faltaEm(A);if(f.length){A.erro=`Falta ${f.join(" e ")}.`;renderAssist();return}
const v=A.voltar,{voltar,fase,erro,texto,resposta,...item}=A;v.lista[v.idx]=item;A={fase:"lista",lista:v.lista,texto:v.texto,resposta:v.resposta,erro:""};renderAssist();return}
try{
if(A.tipo==="pagar"){if(!A.item){A.erro="Escolhe a conta.";renderAssist();return}if(A.valor==null){A.erro="Coloca o valor pago.";renderAssist();return}
await marcarPago(A.item,ymd(status(A.item).data),A.valor);toast(isEntrada(A.item)?"Marcado como recebido":"Marcado como pago");setAba(A.item.tipo)}
else{
const [tipo,sentido]=A.tipo.split("-");
if(!A.nome){A.erro="Coloca o nome.";renderAssist();return}
if(A.valor==null){A.erro="Coloca o valor.";renderAssist();return}
if(tipo==="semanal"&&(A.dia==null||A.dia<0||A.dia>6)){A.erro="Escolhe o dia da semana.";renderAssist();return}
if((tipo==="fixo"||tipo==="variavel")&&!(A.dia>=1&&A.dia<=31)){A.erro="O dia do vencimento vai de 1 a 31.";renderAssist();return}
if((tipo==="avulso"||tipo==="quinzenal")&&!/^\d{4}-\d{2}-\d{2}$/.test(A.data||"")){A.erro="Escolhe a data.";renderAssist();return}
await salvarItemVoz(A);setAba(tipo);toast("Conta salva")}
A=null;renderAssist();render();
}catch(x){A.erro="Não consegui salvar. Tenta de novo.";renderAssist()}
}
$("assist").addEventListener("click",e=>{
const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
if(a==="iniciar"){A={fase:"falar",texto:"",erro:""};renderAssist();if(SR)ouvir();else{const el=$("aTxt");if(el)el.focus()}return}
if(a==="cancelar"){pararMic();A=null;renderAssist();return}
if(a==="mic"){ouvir();return}
if(a==="pronto"){pararMic();processar(($("aTxt")||{}).value);return}
if(a==="denovo"){pararMic();A={fase:"falar",texto:"",erro:""};renderAssist();if(SR)ouvir();return}
if(a==="tipo"){lerFicha();const era=A.tipo;A.tipo=v;A.erro="";
if(v.startsWith("semanal")&&!(era||"").startsWith("semanal"))A.dia=null;
if((v==="fixo"||v==="variavel")&&(era||"").startsWith("semanal"))A.dia=null;
if((v.startsWith("avulso")||v.startsWith("quinzenal"))&&!A.data)A.data=ymd(hoje());
if((v.startsWith("fixo")||v.startsWith("variavel"))&&(era||"").startsWith("quinzenal"))A.dia=null;
if(v==="pagar"&&!A.item)A.item=acharConta(A.texto||A.nome||"");
renderAssist();return}
if(a==="salvar"){salvarAssist();return}
if(a==="salvartudo"){salvarTudo();return}
if(a==="tirar"){A.lista.splice(+v,1);A.erro="";if(!A.lista.length){A=null}renderAssist();return}
if(a==="ajustar"){const i=+v,x=A.lista[i];A={...x,fase:"conferir",texto:"",resposta:"",erro:"",voltar:{lista:A.lista,idx:i,texto:A.texto,resposta:A.resposta}};renderAssist();return}
if(a==="voltarlista"){const v2=A.voltar;A={fase:"lista",lista:v2.lista,texto:v2.texto,resposta:v2.resposta,erro:""};renderAssist();return}
});
$("assist").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="aTxt"){e.preventDefault();pararMic();processar(e.target.value)}});
renderAssist();
(function(){const t=hoje();$("hoje").textContent=`${DIAS[t.getDay()]}, ${t.getDate()} de ${MESES[t.getMonth()]}`})();
function iniciar(){lsLoad();pronto=true;render()}
window.addEventListener("storage",e=>{if(e.key===LS){lsLoad();render()}});
$("alerts").addEventListener("click",e=>{if(e.target.closest("[data-act=backup]"))$("bkSalvar").click()});
$("bkSalvar").addEventListener("click",()=>{
const blob=new Blob([JSON.stringify({app:"contas-em-dia",versao:1,salvoEm:new Date().toISOString(),itens,pagos},null,2)],{type:"application/json"});
const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`contas-em-dia-${ymd(hoje())}.json`;
document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);try{localStorage.setItem(LS_BK,ymd(hoje()))}catch(e){}renderAvisos();toast("Cópia salva");
});
const ICS_DIA=["SU","MO","TU","WE","TH","FR","SA"];
const icsTxt=t=>String(t).replace(/[\\;,]/g,m=>"\\"+m).replace(/\n/g,"\\n");
const icsData=d=>ymd(d).replace(/-/g,"");
function icsDobra(l){let o="";while(l.length>73){o+=l.slice(0,73)+"\r\n ";l=l.slice(73)}return o+l}
function gerarIcs(){
const ag=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
const ev=[];
for(const it of itens){
if(it.tipo==="avulso")continue;
const s=status(it);if(s.quitado)continue;
const ini=s.kind==="done"&&s.proxima?s.proxima:s.data;if(!ini)continue;
let rr;
if(isMensal(it)){rr="FREQ=MONTHLY;"+(it.dia>28?`BYMONTHDAY=${Array.from({length:it.dia-27},(_,i)=>28+i).join(",")};BYSETPOS=-1`:`BYMONTHDAY=${it.dia}`);
}
else if(isQuinz(it))rr=`FREQ=WEEKLY;INTERVAL=2;BYDAY=${ICS_DIA[ini.getDay()]}`;
else rr=`FREQ=WEEKLY;BYDAY=${ICS_DIA[it.dia]}`;
if(temParcelas(it)){const n=it.parcelas-numParcela(it,ini)+1;if(n<1)continue;rr+=`;COUNT=${n}`}
const fim=new Date(ini);fim.setDate(fim.getDate()+1);
const ent=isEntrada(it),tit=`${ent?"Entra":"Vence"}: ${it.nome} (${brl(it.valor)})`;
ev.push(["BEGIN:VEVENT",`UID:${it.id}@contas-em-dia`,`DTSTAMP:${ag}`,`DTSTART;VALUE=DATE:${icsData(ini)}`,`DTEND;VALUE=DATE:${icsData(fim)}`,`RRULE:${rr}`,
`SUMMARY:${icsTxt(tit)}`,`DESCRIPTION:${icsTxt(quando(it)+" · Contas em Dia")}`,"TRANSP:TRANSPARENT",
"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsTxt(tit+" amanhã")}`,"TRIGGER:-PT15H","END:VALARM",
"BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsTxt(tit+" hoje")}`,"TRIGGER:PT9H","END:VALARM","END:VEVENT"].map(icsDobra).join("\r\n"));
}
if(!ev.length)return null;
return ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Contas em Dia//PT-BR","CALSCALE:GREGORIAN","X-WR-CALNAME:Contas em Dia",...ev,"END:VCALENDAR",""].join("\r\n");
}
$("calExportar").addEventListener("click",()=>{
const ics=gerarIcs();if(!ics){toast("Nenhuma conta que se repete para colocar no calendário");return}
const url=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"}));
if(/iPhone|iPad|iPod/.test(navigator.userAgent))location.href=url;
else{const a=document.createElement("a");a.href=url;a.download="contas-em-dia.ics";document.body.appendChild(a);a.click();a.remove()}
setTimeout(()=>URL.revokeObjectURL(url),60000);$("calDica").hidden=false;
});
let bkDados=null;
$("bkArquivo").addEventListener("change",async e=>{
const f=e.target.files[0];e.target.value="";if(!f)return;
try{const j=JSON.parse(await f.text());if(j.app!=="contas-em-dia"||!Array.isArray(j.itens))throw 0;
bkDados=j;$("bkMsg").textContent=`Cópia com ${j.itens.length} conta${j.itens.length===1?"":"s"}. Isso substitui o que está aqui agora.`;$("bkConfirma").hidden=false}
catch(x){toast("Esse arquivo não é uma cópia do Contas em Dia")}
});
document.querySelector("label[for=bkArquivo]").addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();$("bkArquivo").click()}});
$("bkNao").addEventListener("click",()=>{bkDados=null;$("bkConfirma").hidden=true});
$("bkSim").addEventListener("click",()=>{itens=bkDados.itens;pagos=bkDados.pagos||{};lsSave();bkDados=null;$("bkConfirma").hidden=true;render();toast("Contas restauradas")});
iniciar();
setInterval(()=>{if(pronto&&document.visibilityState==="visible")render()},60*60*1000);
</script>
